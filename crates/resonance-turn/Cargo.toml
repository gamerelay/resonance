[package]
name = "resonance-turn"
description = "A room-scoped TURN relay core, sans-I/O: every rule, no sockets."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23"
crc32fast = "1"
# Tickets: the issuer's signature, and the password by key agreement with the node.
ed25519-dalek = "3"
hmac = "0.13"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
x25519-dalek = { version = "3", features = ["static_secrets"] }
