[package]
name = "resonance-node"
description = "A Resonance relay node: the room-scoped TURN core on a UDP socket."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.3"
libc = "0.2"
resonance-proto.workspace = true
resonance-turn.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
ureq = { version = "3", default-features = false, features = ["rustls"] }
