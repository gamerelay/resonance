[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/gamerelay/resonance"
rust-version = "1.85"

[workspace.dependencies]
resonance-proto = { path = "crates/resonance-proto" }
resonance-turn = { path = "crates/resonance-turn" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
