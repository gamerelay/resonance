name: audit
# RustSec advisories against Cargo.lock: on every change to the dependencies, and weekly for
# advisories published since.
on:
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, "crates/*/Cargo.toml", .github/workflows/audit.yml]
  pull_request:
    paths: [Cargo.toml, Cargo.lock, "crates/*/Cargo.toml", .github/workflows/audit.yml]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings
