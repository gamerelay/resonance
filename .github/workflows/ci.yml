name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      # A debug build checks integer overflow, which release builds wrap silently: the tests and
      # the fuzz run again with it on, so "nothing panics" covers overflow too.
      - run: cargo test
      - run: FUZZ_ITERS=2000000 cargo test --test fuzz
      - run: cargo build --release -p resonance-node
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: interop/go.mod
      - name: interop with pion's TURN client
        run: cd interop && go test -count=1 ./...
      - name: interop with coturn's TURN client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq coturn && interop/coturn.sh

  msrv:
    # rust-version in Cargo.toml: what the crates promise to build with.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.85"
      - run: cargo check --workspace --all-targets --locked

  browsers:
    # Chromium, Firefox and WebKit's own TURN clients through the node, every pairing, relay only:
    # over UDP, TCP and TLS.
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apt-get update -qq && apt-get install -y -qq build-essential libnss3-tools
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - run: cargo build --release -p resonance-node
      - name: every browser pairing through the node
        working-directory: interop/browsers
        # Firefox won't start as root with another user's HOME (GitHub sets /github/home).
        env:
          HOME: /root
        run: |
          npm ci --no-audit --no-fund
          export NODE_BIN=$GITHUB_WORKSPACE/target/release/resonance-node
          node relay.mjs
          TRANSPORT=tcp node relay.mjs
          # WebKit's TURN client trusts only its built-in roots, so no test CA: checked against a
          # real certificate instead.
          TRANSPORT=tls BROWSERS=chromium,firefox node relay.mjs
          # And nobody accepts a certificate they don't trust.
          if TRANSPORT=tls TLS_TRUST=none BROWSERS=chromium,firefox node relay.mjs; then
            echo "an untrusted certificate was accepted"; exit 1
          fi
